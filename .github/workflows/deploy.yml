name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Create deployment package
      run: |
        cd dist
        zip -r ../deployment.zip .
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-files
        path: deployment.zip
        
    - name: Deploy to Hostinger (Manual)
      run: |
        echo "🚀 Build completed successfully!"
        echo "📦 Files are ready for upload to Hostinger"
        echo "📁 Upload contents of dist/ folder to public_html/"
        echo "🌐 Your site will be live at your domain"
        
    - name: Notify deployment status
      run: |
        echo "✅ Deployment workflow completed"
        echo "📋 Next steps:"
        echo "1. Login to Hostinger Control Panel"
        echo "2. Go to File Manager"
        echo "3. Navigate to public_html/"
        echo "4. Upload all files from dist/ folder"
        echo "5. Your site will be live!" 